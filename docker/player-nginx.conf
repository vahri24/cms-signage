server {
    listen 80;
    server_tokens off;

    root /var/www/html;
    index index.html;

    # Public player: static index.html + media/ only, nothing else exists
    # in this image (no PHP, no admin code).
    location / {
        try_files $uri $uri/ =404;
    }

    location /media/ {
        autoindex off;
    }
}
